<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>score.js 골든 테스트</title>
  <style>body{font-family:system-ui,sans-serif;padding:16px} .pass{color:#1f7a3f} .fail{color:#b91c1c} td{padding:2px 8px}</style>
</head>
<body>
  <!-- [이 파일이 하는 일]
       브라우저용 채점 테스트. 이 페이지를 열면 js/score.js가 golden_scores.json 정답표와
       같은 답을 내는지 사례마다 검사해 통과/실패를 표시한다(터미널용은 score.test.mjs).
  -->
  <div role="note" data-disclaimer>※ 이 점수는 실제 해킹 확률이 아니라 위험요인 지표입니다.</div>
  <h1>score.js 골든 테스트</h1>
  <p>contracts/golden_scores.json (scripts/sync_bundle이 tests/golden_scores.json으로 복사) 전부 통과해야 합니다.</p>
  <h2 id="result">실행 중…</h2>
  <table id="fails"></table>
  <script type="module">
    import { computeScore } from "../js/score.js";
    const res = await fetch("./golden_scores.json");
    const golden = await res.json();
    const fails = [];
    for (const c of golden.cases) {
      const out = computeScore(c.r, c.weights, c.selected, golden.grades, golden.params);
      const scoreOk = c.expected_score === null ? out.score === null : Math.abs(out.score - c.expected_score) <= golden.tolerance;
      const ok = scoreOk && out.grade === c.expected_grade && out.error === c.expected_error
        && JSON.stringify(out.warnings) === JSON.stringify(c.expected_warnings);
      if (!ok) fails.push({ id: c.id, expected: [c.expected_score, c.expected_grade, c.expected_error], got: [out.score, out.grade, out.error] });
    }
    const el = document.querySelector("#result");
    el.textContent = `${golden.cases.length - fails.length} / ${golden.cases.length} 통과 (golden: ${golden.generated_from}, ${golden.generated_at})`;
    el.className = fails.length ? "fail" : "pass";
    document.querySelector("#fails").innerHTML = fails.map((f) => `<tr class="fail"><td>${f.id}</td><td>기대 ${JSON.stringify(f.expected)}</td><td>결과 ${JSON.stringify(f.got)}</td></tr>`).join("");
    document.title = fails.length ? "FAIL" : "PASS";
  </script>
</body>
</html>
