<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wifi Traffic — 공공와이파이 안전 지도</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/intro.css">
</head>
<body class="intro">
  <!-- [이 파일이 하는 일]
       첫 화면(로그인). 구글·네이버 로그인, 비회원 이용, 로컬 개발용 로그인을 고르고,
       처음 가입한 사람에게는 사는 지역을 묻는다. 아래 <script> 안의 코드가 버튼 동작을 맡는다(js/auth.js·social.js 사용).
  -->
  <div class="disclaimer-bar" role="note" data-disclaimer>※ 이 점수는 실제 해킹 확률이 아니라 위험요인 지표입니다.</div>

  <main class="intro-main">
    <section class="hero">
      <div class="hero-mark">
        <img class="wifi-bg" src="img/wifi.png" alt="" aria-hidden="true">
        <img class="logo" src="img/logo-cutout.png" alt="Wifi Traffic">
      </div>
      <p class="tagline" lang="en">Scan Public Wi-Fi Risks by Color Before Connecting</p>
    </section>

    <section class="auth-card" aria-label="로그인">
      <div id="step-main">
        <p class="card-title">간편 로그인</p>
        <div class="social">
          <div id="google-btn" class="social-slot">
            <button type="button" class="social-btn google" data-provider="google">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
              구글 아이디로 로그인
            </button>
          </div>
          <button type="button" class="social-btn naver" data-provider="naver">
            <span class="naver-n" aria-hidden="true">N</span>
            네이버 아이디로 로그인
          </button>
        </div>
        <p class="msg" id="social-msg" role="alert"></p>

        <div class="divider"><span>또는</span></div>
        <button type="button" id="guest" class="ghost">비회원으로 바로 이용하기</button>
        <p class="guest-note">비회원은 지도를 볼 수 있지만 리뷰·평가·이벤트에는 참여할 수 없습니다.</p>

        <!-- 로컬 개발 주소에서만 보인다(구글·네이버 클라이언트 ID 없이 회원 흐름 시험용) -->
        <button type="button" id="dev-login" class="dev-login" hidden>개발용 로그인 (로컬 전용)</button>
      </div>

      <!-- 구글·네이버로 처음 들어온 사람: 사는 지역만 받고 가입 완료 -->
      <form id="step-region" novalidate hidden>
        <p class="card-title">거의 다 됐어요!</p>
        <p class="welcome"></p>
        <div class="row">
          <label>사는 지역 (시도)<select name="sido" required></select></label>
          <label>시군구<select name="sigungu"></select></label>
        </div>
        <p class="msg" role="alert"></p>
        <button type="submit" class="primary">가입 완료하고 시작하기</button>
        <button type="button" class="link" id="region-cancel">다른 방법으로 로그인</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { loginGuest, socialLogin, pendingSocial, completeSocialSignup, cancelSocialSignup, devLoginAvailable, DEV_PROFILE } from "./js/auth.js";
    import { googleConfigured, naverConfigured, setupGoogle, setupNaver } from "./js/social.js";
    import * as api from "./js/api.js";

    const goMap = () => location.replace("index.html" + location.search);
    const $ = (s) => document.querySelector(s);
    const fRegion = $("#step-region");
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    // 시도·시군구는 지도 화면과 같은 regions.json 목록에서 고른다(글자가 달라 내 지역을 못 찾는 일 방지).
    // 데이터가 아직 없는 시군구(available=false)도 고를 수 있게 둔다 — 데이터가 생기면 그때부터 바로 열린다.
    let regions = [];
    async function loadRegionOptions() {
      try {
        await api.init();
        regions = (await api.getRegions()).regions;
      } catch (e) {
        console.warn("지역 목록을 불러오지 못했습니다:", e.message);
      }
      const sidos = [...new Map(regions.map((r) => [r.sido_code, r.sido])).entries()].sort((a, b) => a[0].localeCompare(b[0]));
      fRegion.sido.innerHTML = `<option value="">선택하세요</option>` + sidos.map(([c, n]) => `<option value="${c}">${esc(n)}</option>`).join("");
      fillSigungu();
    }
    function fillSigungu() {
      const list = regions.filter((r) => r.sido_code === fRegion.sido.value).sort((a, b) => a.sigungu.localeCompare(b.sigungu, "ko"));
      fRegion.sigungu.innerHTML = `<option value="">${fRegion.sido.value ? "선택 안 함" : "시도를 먼저 고르세요"}</option>`
        + list.map((r) => `<option value="${r.region_id}">${esc(r.sigungu)}</option>`).join("");
      fRegion.sigungu.disabled = !list.length;
    }
    fRegion.sido.addEventListener("change", fillSigungu);
    const regionsReady = loadRegionOptions();

    const setMsg = (el, text, ok = false) => {
      const m = el.matches(".msg") ? el : el.querySelector(".msg");
      m.textContent = text;
      m.classList.toggle("ok", ok);
    };
    const socialMsg = $("#social-msg");

    // ── 구글·네이버 ──
    const LABEL = { google: "구글", naver: "네이버", dev: "개발용" };
    async function showRegionStep(profile) {
      $("#step-main").hidden = true;
      fRegion.hidden = false;
      fRegion.querySelector(".welcome").textContent =
        `${LABEL[profile.provider]} 계정${profile.name ? ` (${profile.name})` : ""}으로 처음 오셨네요. 사는 지역을 알려 주시면 내 동네 지도부터 보여 드려요.`;
      await regionsReady;
      fRegion.sido.focus();
    }
    function onProfile(profile) {
      try {
        if (socialLogin(profile)) goMap(); else showRegionStep(profile);
      } catch (err) { onError(err); }
    }
    const onError = (e) => setMsg(socialMsg, e.message);

    fRegion.addEventListener("submit", (e) => {
      e.preventDefault();
      const sidoCode = fRegion.sido.value;
      const picked = regions.find((r) => r.region_id === fRegion.sigungu.value);
      const sido = regions.find((r) => r.sido_code === sidoCode)?.sido ?? "";
      try {
        completeSocialSignup({ region_id: picked?.region_id ?? null, sido, sigungu: picked?.sigungu ?? "" });
        goMap();
      } catch (err) { setMsg(fRegion, err.message); }
    });
    $("#region-cancel").addEventListener("click", () => {
      cancelSocialSignup();
      fRegion.hidden = true;
      $("#step-main").hidden = false;
    });
    if (pendingSocial()) showRegionStep(pendingSocial());

    const notReady = (name, file) => () =>
      setMsg(socialMsg, `${name} 로그인은 아직 설정 전입니다. js/oauth-config.js에 ${file} 클라이언트 ID를 넣어 주세요.`);

    if (googleConfigured()) {
      setupGoogle($("#google-btn"), onProfile, onError).catch(onError);
    } else {
      $("#google-btn button").addEventListener("click", notReady("구글", "Google"));
    }
    const naverBtn = $(".social-btn.naver");
    if (naverConfigured()) {
      naverBtn.disabled = true;
      setupNaver(onProfile, onError)
        .then((start) => { naverBtn.disabled = false; naverBtn.addEventListener("click", start); })
        .catch(onError);
    } else {
      naverBtn.addEventListener("click", notReady("네이버", "Naver"));
    }

    // ── 개발용 로그인 (로컬 전용) ──
    if (devLoginAvailable()) {
      const devBtn = $("#dev-login");
      devBtn.hidden = false;
      devBtn.addEventListener("click", () => onProfile(DEV_PROFILE));
    }

    $("#guest").addEventListener("click", () => { loginGuest(); goMap(); });
  </script>
</body>
</html>
