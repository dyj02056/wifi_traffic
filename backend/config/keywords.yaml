# R3(실외) 키워드와 금지 표현. 코드에 문자열을 박지 않고 여기서만 관리한다.
# 2026-10-20 census(place_detail_census.csv) 기반 후보 적용. 근거·매칭 행 수: config/r3_keyword_candidates.csv
# 사용자가 검토 후 확정하면 r3_status를 confirmed로 바꾼다.
r3_status: draft
r3_outdoor_keywords:
  - 정류장
  - 정류소
  - 공원
  - 광장
  - 거리
  - 시장
  - 실외
  - 야외
  - 옥외
  - 승강장
  - 쉘터
  - 가로등
  - 폴대
  - CCTV
  - 스마트폴
  - 통신주
  - IP주
  - 강관주
  - 방범
  - 하천
  - 안양천
  - 해수욕장
  - 둘레길
  - 운동장
  - 케이블카
  - 옥상
  - 외벽
  - 아케이드
# 실외 키워드가 있어도 이 단어가 함께 있으면 실내로 본다 (예: "공원 관리동 로비")
r3_indoor_override_keywords:
  - "옥내"
  - "실내"
  - "내부"
  - "건물내"
  - "건물 내"
  - "로비"
  - "복도"
  - "사무실"
  - "민원실"
  - "대합실"

# 화면·AI 출력 어디에도 나오면 안 되는 표현 (plan.md §0-7)
forbidden_phrases:
  - 해킹 확률
  - 해킹될 확률
  - 해킹 위험 지역
  - 사건 발생 지역
  - 범죄 다발
  - 위험 지역
# 금지 표현이 들어 있어도 허용하는 부정형 문장(면책 문구 등)
allowed_negations:
  - 이 점수는 실제 해킹 확률이 아니라 위험요인 지표입니다.
  - 실제 해킹 확률이 아니라
  - 해킹 확률이 아닙니다
