# 데이터 소스 목록 (plan.md §5). 목록 밖 소스를 추가하려면 docs/requests.md에 사유를 쓰고 리드 승인을 받는다.
# API 엔드포인트는 활용신청 후 data.go.kr Swagger 화면에서 복사해 넣는다. 추측 URL 금지.
#
# [이 파일이 하는 일]
#   이 프로젝트가 쓰는 외부 데이터의 '출처 목록'과 배경 통계 '차트 정의'를 적어 둔 설정 파일이다.
#   - sources: 데이터마다 번호(D1~D6), 이름, 공공데이터포털 번호, 주소, 받는 방법, 저장 위치
#       D1 = 점수 계산의 원본(전국 무료와이파이), D2 = R1 검증용(구로구), D3~D5 = 배경 통계, D6 = 사례 카드
#   - background_charts: /context 화면에 그릴 차트 목록(어느 출처의 어느 칸을 쓸지)
#   pipeline/daily_sync.py, wifisafe/assemble.py, wifisafe/background.py 등이 이 파일을 읽는다.
#
# [YAML 읽는 법] '이름: 값' 한 줄이 항목 하나, 들여쓰기는 '안에 들어 있음', '- '로 시작하면 목록의 한 칸,
#   [a, b]는 목록, {a: b}는 짝 묶음, #부터 줄 끝까지는 주석(설명)이다.
sources:
  D1:
    name: 전국무료와이파이표준데이터
    dataset_id: "15013116"
    url: https://www.data.go.kr/data/15013116/standard.do
    access: csv_manual           # 수동 등록(import_downloads.py)도 계속 가능
    # 자동 수집(pipeline/daily_sync.py, requests #15). 키 불필요, 매일 갱신(2일 전 기준).
    # 2026-10-20 확인: 공공데이터포털 15013116의 제공 URL이 이 LOCALDATA 파일로 연결되고, 받은 파일 해시가 수동 다운로드와 같았다.
    download_url: https://file.localdata.go.kr/file/download/free_wifi_info/info
    download_referer: https://file.localdata.go.kr/file/free_wifi_info/info
  D2:
    name: 서울특별시 구로구_공공와이파이 서비스 위치 정보
    dataset_id: "15147901"
    url: https://www.data.go.kr/data/15147901/fileData.do
    access: csv_manual
    file: data/external/guro_wifi.csv
    retrieved_at: null          # import_downloads.py가 .meta.json에 기록
  D3:
    name: 경찰청_연도별 사이버 범죄 통계 현황
    dataset_id: "15053887"
    url: https://www.data.go.kr/data/15053887/fileData.do   # 2026-10-20 페이지 확인
    access: csv_manual           # 파일데이터는 로그인 없이 CSV 다운로드 가능 → downloads/ + import_downloads.py
    endpoint: ""                # (선택) API로 받을 때만: Swagger의 Request URL
    file: data/external/police_cyber.csv
    retrieved_at: null
  D4:
    name: 한국인터넷진흥원_국내 민간 분야 기업 업종별 침해사고 신고 건수
    dataset_id: "15155733"
    url: https://www.data.go.kr/data/15155733/fileData.do   # 2026-10-20 페이지 확인
    access: csv_manual           # 파일데이터는 로그인 없이 CSV 다운로드 가능 → downloads/ + import_downloads.py
    endpoint: ""                # TODO(확인필요)
    file: data/external/kisa_industry.csv
    retrieved_at: null
  D5:
    name: 한국인터넷진흥원_국내 민간 분야 침해사고 신고 건수
    dataset_id: "15140309"
    url: https://www.data.go.kr/data/15140309/fileData.do   # 2026-10-20 페이지 확인
    access: csv_manual           # 파일데이터는 로그인 없이 CSV 다운로드 가능 → downloads/ + import_downloads.py
    endpoint: ""                # TODO(확인필요), 선택
    file: data/external/kisa_private.csv
    retrieved_at: null
  D6:
    name: 뉴스 기반 사례 카드
    dataset_id: null
    url: data/cases.yaml
    access: manual

# 배경 패널 차트 정의. CSV 컬럼명은 실제 파일을 보고 채운다(추측 금지).
# 정의가 비어 있으면 background.json의 datasets는 빈 배열이 되고 /context는 '준비 중'을 보여준다.
# 2026-10-20 실제 파일 컬럼 확인 후 작성(requests #30). 읽기 옵션은 wifisafe/background.py chart_series 참고.
# 각 항목: id(차트 이름표), source(출처 번호), title(차트 제목), unit(단위),
#   row_filter(이 값인 줄만 사용), label_column(가로축 칸), value_columns(막대로 쓸 칸들),
#   group_names(칸 이름 → 범례 이름), wide_columns(연도가 칸으로 놓인 표에서 고를 칸 패턴), note(차트 아래 설명)
background_charts:
  - id: police_hacking_by_year
    source: D3
    title: 연도별 해킹 발생 건수 (유형별)
    unit: 건
    row_filter: {구분: 발생건수}
    label_column: 연도
    value_columns: [해킹_계정도용, 해킹_단순침입, 해킹_자료유출, 해킹_자료훼손]
    group_names: {해킹_계정도용: 계정도용, 해킹_단순침입: 단순침입, 해킹_자료유출: 자료유출, 해킹_자료훼손: 자료훼손}
    sort_by_label: true
    note: 경찰청 전국 통계이며 와이파이 지점과 직접 연결되지 않습니다
  - id: kisa_private_incidents_by_year
    source: D5
    title: 연도별 민간 분야 침해사고 신고 건수
    unit: 건
    row_filter: {구분: 신고 건수}
    wide_columns: '\d{4}년'          # 상반기·하반기 칸은 빼고 연도 합계 칸만
    note: 한국인터넷진흥원 전국 통계이며 와이파이 지점과 직접 연결되지 않습니다
